<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2e9">
<title>Yoga Stüdyom</title>
<style>
:root{--bg:#f7f4ed;--paper:#fffdf8;--ink:#26382f;--muted:#778078;--sage:#667b69;--sage2:#e5ebe1;--sand:#efe3d5;--line:#e6e1d7;--rose:#f3e3df;--shadow:0 8px 28px #3443360c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px}.lotus{width:42px;height:42px;border-radius:15px;background:var(--sage2);display:grid;place-items:center;font-size:24px}.brand h1{font-family:Georgia,serif;font-size:25px;font-weight:500;margin:0}.brand p{margin:0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:13px;width:42px;height:42px;color:var(--ink);font-size:18px}.page{padding:0 18px}.welcome{padding:22px;border-radius:24px;background:linear-gradient(180deg,#f6e3d0 0%,#f3c9a9 30%,#e8b8a0 46%,#9baeb0 47%,#587b80 68%,#314f55 100%);margin-bottom:18px;position:relative;overflow:hidden;color:#243b3b}.welcome:before{content:'';position:absolute;left:-8%;right:-8%;height:44%;bottom:0;background:linear-gradient(165deg,transparent 0 25%,#6e8986 26% 31%,transparent 32%),linear-gradient(195deg,transparent 0 39%,#3c6267 40% 48%,transparent 49%);opacity:.8;pointer-events:none}.welcome:after{content:'';position:absolute;width:56px;height:56px;border-radius:50%;background:#fff0c6;box-shadow:0 0 35px 15px #ffdfac77;top:27%;left:calc(50% - 28px);pointer-events:none}.welcome>*{position:relative;z-index:1}.welcome h2{color:#263d3d}.welcome .statrow{margin-top:90px}.welcome .stat{background:#fffdf0d9}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#637363;font-weight:700}.welcome h2{font:500 30px/1.12 Georgia,serif;margin:8px 0}.welcome p{max-width:470px;color:#59675d;margin:8px 0 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px;gap:10px}.section-head h2{font:500 21px Georgia,serif;margin:0}.linkbtn{background:none;border:0;color:var(--sage);font-weight:650;padding:6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;min-height:120px;box-shadow:var(--shadow);color:var(--ink)}.tile .emoji{font-size:25px;display:block;margin-bottom:11px}.tile strong{display:block;font-size:14px}.tile small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}.itemrow{display:flex;align-items:center;gap:12px}.thumb{width:48px;height:48px;border-radius:14px;background:var(--sage2);display:grid;place-items:center;font-size:23px;flex-shrink:0}.itemmain{min-width:0;flex:1}.itemmain strong{display:block;font-size:14px;overflow-wrap:anywhere}.itemmain small{color:var(--muted);font-size:12px}.arrow{color:#8c958c;font-size:20px;border:0;background:none;padding:5px}.searchrow{display:flex;gap:8px;margin:12px 0}.searchrow input{flex:1;min-width:0}.input,textarea,select{width:100%;background:#fffefa;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);outline:none}.input:focus,textarea:focus,select:focus{border-color:#9aaa97;box-shadow:0 0 0 3px #dce5d9}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 8px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:var(--paper);padding:7px 11px;font-size:12px;color:var(--muted)}.chip.active{background:var(--sage);border-color:var(--sage);color:white}.primary{border:0;background:var(--sage);color:white;padding:12px 16px;border-radius:13px;font-weight:650}.secondary{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:11px 14px;border-radius:13px;font-weight:600}.danger{color:#a44d46;border:1px solid #e8c9c5;background:#fff8f6;padding:10px 12px;border-radius:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.formgrid{display:grid;grid-template-columns:1fr;gap:13px}.field label{display:block;font-size:12px;font-weight:700;color:#647168;margin-bottom:6px}.field textarea{min-height:110px;resize:vertical}.field textarea.tall{min-height:180px}.field textarea.notecontent{min-height:58vh;resize:vertical;line-height:1.65}.welcome{background:linear-gradient(135deg,#e7ebdf,#f2e3d4);color:var(--ink);padding:22px;margin-bottom:18px}.welcome h2{font:500 24px/1.35 Georgia,serif;margin:8px 0 0;max-width:720px}.welcome:before,.welcome:after{display:none}.formfooter{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.empty{text-align:center;padding:35px 16px;color:var(--muted)}.empty .emoji{font-size:34px}.empty h3{color:var(--ink);font:500 21px Georgia,serif;margin:8px 0}.detailtitle{font:500 28px/1.15 Georgia,serif;margin:8px 0}.detailtext{white-space:pre-wrap;overflow-wrap:anywhere}.taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:11px;border-radius:99px;background:var(--sage2);padding:5px 9px;color:#50624f}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8f2;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}.navinner{width:min(700px,100%);display:flex;justify-content:space-around;gap:4px}.navbtn{background:none;border:0;color:#7c857d;min-width:52px;padding:5px 8px;border-radius:12px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}.navbtn span{font-size:20px;line-height:1.2}.navbtn.active{color:var(--sage);background:var(--sage2);font-weight:700}.fab{border:0;background:var(--sage);color:white;border-radius:50%;width:45px;height:45px;font-size:26px;line-height:1;box-shadow:0 4px 12px #26382f25;margin-top:-18px;border:4px solid var(--bg)}.back{border:0;background:none;padding:8px 0;color:var(--sage);font-weight:650}.split{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:var(--muted);font-size:13px}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{padding:12px;border-radius:15px;background:#ffffffa8}.stat b{display:block;font:500 23px Georgia,serif}.stat small{color:var(--muted);font-size:11px}.posegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.posecard{padding:0;overflow:hidden}.posevisual{height:96px;background:linear-gradient(135deg,#e4e9dc,#f2e5d7);display:grid;place-items:center;font-size:40px}.poseinfo{padding:12px}.poseinfo strong{display:block}.poseinfo small{color:var(--muted)}.sequenceitem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.sequenceitem:last-child{border-bottom:0}.sequenceitem .itemmain{flex:1}.sequenceitem input{width:66px;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fffefa}.notice{padding:12px 14px;background:#f2eadb;border-radius:13px;font-size:12px;color:#75684f;margin:12px 0}.hidden{display:none!important}@media(min-width:680px){.page{padding:0 28px}.top{padding:28px 28px 18px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.posegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.formgrid.two{grid-template-columns:1fr 1fr}.welcome{padding:30px}.welcome h2{font-size:38px}}@media(min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.posegrid{grid-template-columns:repeat(4,minmax(0,1fr))}.app{padding-bottom:30px}.bottomnav{position:sticky;bottom:0}.top{padding-top:32px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="lotus">❋</div><div><h1>Yoga Stüdyom</h1></div></div>
  <div class="top-actions"><button class="iconbtn" aria-label="Ara" onclick="go('notes');setTimeout(()=>document.getElementById('search')?.focus(),60)">⌕</button><button class="iconbtn" aria-label="Yedekleme" onclick="go('profile')">⚙</button></div>
</header>
<main id="main" class="page"></main>
</div>
<nav class="bottomnav"><div class="navinner">
<button class="navbtn active" data-page="home" onclick="go('home')"><span>⌂</span>Ana Sayfa</button>
<button class="navbtn" data-page="notes" onclick="go('notes')"><span>▤</span>Notlar</button>
<button class="fab" aria-label="Yeni içerik" onclick="newChooser()">+</button>
<button class="navbtn" data-page="library" onclick="go('library')"><span>❋</span>Kütüphane</button>
<button class="navbtn" data-page="profile" onclick="go('profile')"><span>◯</span>Yedekleme</button>
</div></nav>
<script>
const CATS=[
 {id:'personal',name:'Kişisel Deneyimler',short:'Kişisel Deneyimler',icon:'♡',color:'rose'},
 {id:'training',name:'Ders Notları',short:'Ders Notları',icon:'▤',color:'sand'},
 {id:'lessonnotes',name:'Ders Planları',short:'Ders Planları',icon:'▦',color:'blue'},
 {id:'pose',name:'Poz ve Varyasyon',short:'Poz ve Varyasyon',icon:'❋',color:'sage'},
 {id:'anatomy',name:'Anatomi Notları',short:'Anatomi Notları',icon:'♧',color:'sage'},
 {id:'meditation',name:'Meditasyon ve Pranayama',short:'Meditasyon',icon:'☼',color:'green'}
];
const KEY='yogaStudioDataV1';
let data={notes:[],classes:[],poses:[]},page='home',editing=null,detail=null,libraryTab='poses',searchTerm='',noteFilter='all';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');data={notes:Array.isArray(x.notes)?x.notes:[],classes:Array.isArray(x.classes)?x.classes:[],poses:Array.isArray(x.poses)?x.poses:[]}}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cat(id){return CATS.find(c=>c.id===id)||CATS[0]}
function fmt(d){if(!d)return '';try{return new Date(d).toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}}
function allItems(){return [...data.notes.map(x=>({...x,kind:'note'})),...data.classes.map(x=>({...x,kind:'class',category:'class'})),...data.poses.map(x=>({...x,kind:'pose',category:'pose'}))].sort((a,b)=>(b.updated||b.created||'').localeCompare(a.updated||a.created||''))}
function go(p){page=p;editing=null;detail=null;render()}
function setNav(){document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function render(){setNav();const m=document.getElementById('main');if(page==='home')m.innerHTML=home();else if(page==='notes')m.innerHTML=notesPage();else if(page==='library')m.innerHTML=libraryPage();else if(page==='classlist')m.innerHTML=classListPage();else if(page==='anatomy')m.innerHTML=anatomyPage();else if(page==='profile')m.innerHTML=profilePage();else if(page==='edit')m.innerHTML=editPage();else if(page==='detail')m.innerHTML=detailPage();else if(page==='classedit')m.innerHTML=classEditPage();else if(page==='poseedit')m.innerHTML=poseEditPage();window.scrollTo({top:0,behavior:'smooth'})}
const DAILY_INTENTIONS=[
 'Bugün kendime sabırla ve şefkatle yaklaşıyorum.',
 'Bugün bedenimi dinliyor, kendi sınırlarıma saygı duyuyorum.',
 'Bugün her şeyi bilmek zorunda olmadığımı kendime hatırlatıyorum.',
 'Bugün nefesime dönüyor ve kendime alan açıyorum.',
 'Bugün öğrenmeye merakla ve açık bir zihinle yaklaşıyorum.',
 'Bugün kendi ritmime güveniyor, acele etmiyorum.',
 'Bugün kendimi olduğum hâlimle kabul etmeye niyet ediyorum.',
 'Bugün pratiğimde yumuşaklığa ve farkındalığa yer açıyorum.',
 'Bugün ihtiyaçlarımı fark ediyor ve kendime kulak veriyorum.',
 'Bugün küçük adımlarımın da değerli olduğunu kendime hatırlatıyorum.',
 'Bugün kendimle daha dürüst ve nazik bir ilişki kuruyorum.',
 'Bugün kontrol edemediklerimi bırakıp şu ana dönüyorum.'
];
function dailyIntention(){const now=new Date();const day=Math.floor(new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()/86400000);return DAILY_INTENTIONS[((day%DAILY_INTENTIONS.length)+DAILY_INTENTIONS.length)%DAILY_INTENTIONS.length]}
function home(){return `
<section class="welcome"><div class="eyebrow">BUGÜNÜN NİYETİ</div><h2>${dailyIntention()}</h2></section>
<div class="grid">
<button class="tile" onclick="go('notes');noteFilter='all'"><span class="emoji">📚</span><strong>Notlarım</strong></button>
<button class="tile" onclick="go('library')"><span class="emoji">🧘</span><strong>Poz Kütüphanesi</strong></button>
<button class="tile" onclick="go('classlist')"><span class="emoji">📝</span><strong>Ders Planlarım</strong></button>
<button class="tile" onclick="newNote('meditation')"><span class="emoji">☼</span><strong>Meditasyon ve Pranayama</strong></button>
<button class="tile" onclick="go('anatomy')"><span class="emoji">🦴</span><strong>Anatomi</strong></button>
</div>`}
function itemRow(x){let c=cat(x.category);let emoji=x.kind==='class'?'📝':x.kind==='pose'?'🧘':c.icon;return `<div class="card"><div class="itemrow"><div class="thumb">${emoji}</div><div class="itemmain"><strong>${esc(x.title||'Başlıksız')}</strong><small>${esc(x.kind==='class'?'Ders Planı':x.kind==='pose'?'Poz Kütüphanesi':c.short)}${x.group?' · '+esc(x.group):''} · ${fmt(x.updated||x.created)}</small></div><button class="arrow" onclick="openItem('${x.kind}','${x.id}')">›</button></div></div>`}
function notesPage(){return `<div class="section-head"><h2>Notlarım</h2><button class="primary" onclick="newChooser()">+ Ekle</button></div><div class="searchrow"><input id="search" class="input" placeholder="Notlarında ara..." value="${esc(searchTerm)}" oninput="searchTerm=this.value;const m=document.querySelector('.listarea');if(m)m.innerHTML=noteList();"><button class="secondary" onclick="searchTerm='';render()">Temizle</button></div><div class="filters"><button class="chip ${noteFilter==='all'?'active':''}" onclick="noteFilter='all';render()">Tümü</button>${CATS.map(c=>`<button class="chip ${noteFilter===c.id?'active':''}" onclick="noteFilter='${c.id}';render()">${c.short}</button>`).join('')}</div><div class="listarea">${noteList()}</div>`}
function groupOptions(){const groups=[...new Set(data.notes.map(n=>n.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));return `<option value="all" ${groupFilter==='all'?'selected':''}>Tüm gruplar</option>${groups.map(g=>`<option value="${esc(g)}" ${groupFilter===g?'selected':''}>${esc(g)}</option>`).join('')}`}
function noteList(){let list=data.notes.filter(n=>(groupFilter==='all'||(n.group||'')===groupFilter)&&(noteFilter==='all'||n.category===noteFilter)&&(`${n.title} ${n.content} ${n.group||''}`).toLocaleLowerCase('tr').includes(searchTerm.toLocaleLowerCase('tr'))).sort((a,b)=>(b.updated||b.created).localeCompare(a.updated||a.created));return list.length?list.map(itemRow).join(''):`<div class="card empty"><div class="emoji">📖</div><h3>Henüz burada içerik yok</h3><p>Bir not ekleyebilir veya arama kelimeni değiştirebilirsin.</p><button class="primary" onclick="newNote()">Not oluştur</button></div>`}
function libraryPage(){let poses=data.poses;return `<div class="section-head"><h2>Poz kütüphanesi</h2><button class="primary" onclick="newPose()">+ Poz ekle</button></div><p class="muted">Pozları, varyasyonları, hedeflenen bölgeleri ve kendi gözlemlerini bir arada tut.</p><div class="searchrow"><input id="poseSearch" class="input" placeholder="Poz ara..." oninput="filterPoses(this.value)"></div><div class="posegrid" id="posegrid">${poseCards(poses)}</div><div class="section-head"><h2>Diğer içerikler</h2></div>${data.notes.filter(n=>n.category==='meditation').slice(0,3).map(itemRow).join('')||`<div class="card"><div class="muted">Meditasyon ve pranayama metinlerini Notlar bölümünden ekleyebilirsin.</div><div class="actions"><button class="secondary" onclick="newNote('meditation')">+ Metin ekle</button></div></div>`}`}
function poseCards(poses){return poses.length?poses.map(p=>`<button class="card posecard" onclick="openItem('pose','${p.id}')" style="text-align:left;color:var(--ink);width:100%"><div class="posevisual">🧘</div><div class="poseinfo"><strong>${esc(p.title)}</strong><small>${esc(p.sanskrit||p.type||'Poz')}</small></div></button>`).join(''):`<div class="card empty" style="grid-column:1/-1"><div class="emoji">❋</div><h3>Kütüphaneni oluştur</h3><p>Butterfly, Caterpillar veya üzerinde çalıştığın başka bir pozla başlayabilirsin.</p><button class="primary" onclick="newPose()">İlk pozu ekle</button></div>`}
function filterPoses(v){let s=v.toLocaleLowerCase('tr');document.getElementById('posegrid').innerHTML=poseCards(data.poses.filter(p=>(p.title+' '+p.sanskrit+' '+p.content+' '+p.type).toLocaleLowerCase('tr').includes(s)))}

function classListPage(){return `<div class="section-head"><h2>Ders Planlarım</h2><button class="primary" onclick="newClass()">+ Yeni ders</button></div><div class="filters"><button class="chip active" onclick="filterClassType('all',this)">Tümü</button><button class="chip" onclick="filterClassType('Yin Yoga',this)">Yin Yoga</button><button class="chip" onclick="filterClassType('Hatha Yoga',this)">Hatha Yoga</button></div><div id="classlistitems">${classRows('all')}</div>`}
function classRows(type){let rows=data.classes.filter(c=>type==='all'||(c.type||'Yin Yoga')===type).sort((a,b)=>(b.updated||b.created).localeCompare(a.updated||a.created));return rows.length?rows.map(c=>`<div class="card"><div class="itemrow"><div class="thumb">📝</div><div class="itemmain"><strong>${esc(c.title)}</strong><small>${esc(c.type||'Yin Yoga')} · ${c.duration} dk${c.theme?' · '+esc(c.theme):''}</small></div><button class="arrow" onclick="openItem('class','${c.id}')">›</button></div></div>`).join(''):`<div class="card empty"><div class="emoji">📝</div><h3>Henüz ders planın yok</h3><p>Yin Yoga veya Hatha Yoga için ilk akışını oluştur.</p><button class="primary" onclick="newClass()">Ders oluştur</button></div>`}
function filterClassType(type,btn){document.querySelectorAll('.filters .chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('classlistitems').innerHTML=classRows(type)}
function anatomyPage(){let list=data.notes.filter(n=>n.category==='anatomy').sort((a,b)=>(b.updated||b.created).localeCompare(a.updated||a.created));return `<div class="section-head"><h2>Anatomi</h2><button class="primary" onclick="newNote('anatomy')">+ Not ekle</button></div><p class="muted">Kaslar, eklemler, fasya, nefes ve hareket üzerine kendi çalışma notların.</p><div class="searchrow"><input class="input" placeholder="Anatomi notlarında ara..." oninput="filterAnatomy(this.value)"></div><div id="anatomylist">${list.length?list.map(itemRow).join(''):`<div class="card empty"><div class="emoji">🦴</div><h3>Anatomi notlarını burada topla</h3><p>İlk notunu ekleyerek kendi anatomi kütüphaneni oluşturmaya başla.</p><button class="primary" onclick="newNote('anatomy')">İlk anatomi notu</button></div>`}</div>`}
function filterAnatomy(v){let s=v.toLocaleLowerCase('tr');document.getElementById('anatomylist').innerHTML=data.notes.filter(n=>n.category==='anatomy'&&(n.title+' '+n.content+' '+(n.group||'')+' '+(n.tags||[]).join(' ')).toLocaleLowerCase('tr').includes(s)).map(itemRow).join('')||'<div class="card empty">Eşleşen anatomi notu bulunamadı.</div>'}

function profilePage(){return `<div class="section-head"><h2>Yedekleme ve ayarlar</h2></div><div class="card"><div class="itemrow"><div class="thumb">🔒</div><div class="itemmain"><strong>Yerel ve kişisel</strong><small>İçeriklerin bu tarayıcıda saklanır; bir hesap gerekmez.</small></div></div><div class="notice">Önemli: Tarayıcı verilerini temizlemek notlarını silebilir. Başka bir cihaza otomatik eşitlenmez. Yedek dosyanı güvenli bir yerde sakla.</div><div class="actions"><button class="primary" onclick="exportData()">Yedek indir (.json)</button><button class="secondary" onclick="document.getElementById('importFile').click()">Yedeği geri yükle</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importData(event)"></div></div><div class="card"><h3 style="margin-top:0">İçerik özeti</h3><p class="muted">Not: ${data.notes.length} · Poz: ${data.poses.length} · Ders planı: ${data.classes.length}</p><button class="secondary" onclick="exportData()">Tüm içerikleri dışa aktar</button></div><div class="card"><h3 style="margin-top:0">Uygulama hakkında</h3><p class="muted">Yoga Stüdyom, yoga öğrenme sürecini, kişisel gözlemlerini ve eğitmenlik hazırlığını düzenlemek için tasarlanmış kişisel bir alandır.</p><p class="muted">İlk sürüm verileri cihazında tutar. Tarayıcı geçmişini silmeden önce yedek al.</p></div><div class="card"><button class="danger" onclick="clearAll()">Tüm verileri sil</button><p class="muted">Bu işlem geri alınamaz. Önce yedek indirmeni öneririz.</p></div>`}
function newChooser(){const m=document.getElementById('main');m.innerHTML=`<button class="back" onclick="go('notes')">← Notlarıma dön</button><div class="section-head"><h2>Ne eklemek istersin?</h2></div><div class="grid"><button class="tile" onclick="newNote('personal')"><span class="emoji">♡</span><strong>Kişisel Deneyimler</strong></button><button class="tile" onclick="newNote('training')"><span class="emoji">📚</span><strong>Ders Notları</strong></button><button class="tile" onclick="newNote('lessonnotes')"><span class="emoji">📝</span><strong>Ders Planları</strong></button><button class="tile" onclick="newNote('pose')"><span class="emoji">🧘</span><strong>Poz ve Varyasyon</strong></button><button class="tile" onclick="newNote('anatomy')"><span class="emoji">🦴</span><strong>Anatomi Notları</strong></button><button class="tile" onclick="newNote('meditation')"><span class="emoji">☼</span><strong>Meditasyon ve Pranayama</strong></button></div>`}
function newNote(category='training',id=null){editing=id;page='edit';detail={category};render()}
function editNotePage(n){return ''}
function editPage(){let n=editing?data.notes.find(x=>x.id===editing):null;let d=n||{title:'',category:detail?.category||'training',content:'',group:''};return `<button class="back" onclick="go('notes')">← Notlarıma dön</button><div class="section-head"><h2>${n?'Notu düzenle':'Yeni not'}</h2></div><form onsubmit="saveNote(event)" class="card"><div class="formgrid"><div class="field"><label>Not başlığı *</label><input class="input" id="ntitle" required maxlength="160" value="${esc(d.title)}" placeholder="Örn. Yin Yoga Workshop"></div><div class="field"><label>Not türü</label><select id="ncat">${CATS.map(c=>`<option value="${c.id}" ${d.category===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label>Not içeriği <span class="muted">(en fazla 1000 kelime)</span></label><textarea class="tall notecontent" id="ncontent" oninput="limitNoteWords(this)" placeholder="Öğrendiklerini, önemli noktaları ve kendi düşüncelerini buraya yaz...">${esc(d.content)}</textarea><div class="split"><small class="muted">Geniş yazı alanı · En fazla 1000 kelime</small><small id="wordCount" class="muted">${wordCount(d.content)} / 1000 kelime</small></div></div><div class="field"><label>Grup / klasör (isteğe bağlı)</label><input class="input" id="ngroup" value="${esc(d.group||'')}" placeholder="Örn. Yin Yoga Eğitimi, Felsefe, Workshop"></div></div><div class="formfooter"><button class="primary" type="submit">Kaydet</button><button class="secondary" type="button" onclick="go('notes')">Vazgeç</button>${n?`<button class="danger" type="button" onclick="deleteItem('note','${n.id}')">Sil</button>`:''}</div></form>`}
function wordCount(text=''){const t=String(text||'').trim();return t?t.split(/\s+/).length:0}
function limitNoteWords(el){const words=el.value.trim().split(/\s+/).filter(Boolean);if(words.length>1000){el.value=words.slice(0,1000).join(' ')}const counter=document.getElementById('wordCount');if(counter)counter.textContent=wordCount(el.value)+' / 1000 kelime'}
function saveNote(e){e.preventDefault();const contentEl=document.getElementById('ncontent');limitNoteWords(contentEl);let old=editing?data.notes.find(x=>x.id===editing):null;let obj={id:old?.id||uid(),title:document.getElementById('ntitle').value.trim(),category:document.getElementById('ncat').value,group:document.getElementById('ngroup').value.trim(),content:contentEl.value,created:old?.created||new Date().toISOString(),updated:new Date().toISOString()};if(old)data.notes=data.notes.map(x=>x.id===old.id?obj:x);else data.notes.unshift(obj);save();page='notes';editing=null;render()}
function newPose(id=null){editing=id;page='poseedit';render()}
function poseEditPage(){let p=editing?data.poses.find(x=>x.id===editing):null;let d=p||{title:'',sanskrit:'',type:'',content:'',areas:'',variations:'',cautions:'',personal:''};return `<button class="back" onclick="go('library')">← Kütüphaneye dön</button><div class="section-head"><h2>${p?'Pozu düzenle':'Yeni poz'}</h2></div><form class="card" onsubmit="savePose(event)"><div class="formgrid two"><div class="field"><label>Poz adı *</label><input class="input" id="ptitle" required value="${esc(d.title)}" placeholder="Butterfly"></div><div class="field"><label>Sanskritçe adı</label><input class="input" id="psanskrit" value="${esc(d.sanskrit)}" placeholder="Baddha Konasana"></div><div class="field"><label>Poz türü / seviye</label><input class="input" id="ptype" value="${esc(d.type)}" placeholder="Oturarak · Yin"></div><div class="field"><label>Hedeflenen bölgeler</label><input class="input" id="pareas" value="${esc(d.areas)}" placeholder="Kalça, iç bacak, bel"></div></div><div class="formgrid"><div class="field"><label>Uygulama ve süre</label><textarea id="pcontent" placeholder="Pozun uygulanışı, süre, destekler...">${esc(d.content)}</textarea></div><div class="field"><label>Varyasyonlar ve ekipman</label><textarea id="pvariations" placeholder="Blok, bolster, battaniye seçenekleri...">${esc(d.variations)}</textarea></div><div class="field"><label>Dikkat edilmesi gerekenler</label><textarea id="pcautions" placeholder="Kişiye göre uyarlama ve dikkat notları...">${esc(d.cautions)}</textarea></div><div class="field"><label>Kendi notlarım</label><textarea id="ppersonal" placeholder="Kendi pratiğinde fark ettiklerin...">${esc(d.personal)}</textarea></div></div><div class="formfooter"><button class="primary" type="submit">Kaydet</button><button class="secondary" type="button" onclick="go('library')">Vazgeç</button>${p?`<button class="danger" type="button" onclick="deleteItem('pose','${p.id}')">Sil</button>`:''}</div></form>`}
function savePose(e){e.preventDefault();let old=editing?data.poses.find(x=>x.id===editing):null;let obj={id:old?.id||uid(),title:document.getElementById('ptitle').value.trim(),sanskrit:document.getElementById('psanskrit').value,type:document.getElementById('ptype').value,areas:document.getElementById('pareas').value,content:document.getElementById('pcontent').value,variations:document.getElementById('pvariations').value,cautions:document.getElementById('pcautions').value,personal:document.getElementById('ppersonal').value,created:old?.created||new Date().toISOString(),updated:new Date().toISOString()};if(old)data.poses=data.poses.map(x=>x.id===old.id?obj:x);else data.poses.unshift(obj);save();page='library';editing=null;render()}
function newClass(id=null){editing=id;page='classedit';render()}
function classEditPage(){let c=editing?data.classes.find(x=>x.id===editing):null;let d=c||{title:'',type:'Yin Yoga',duration:60,theme:'',intention:'',opening:'',sequence:[],closing:''};let seq=d.sequence||[];return `<button class="back" onclick="go('home')">← Ana sayfaya dön</button><div class="section-head"><h2>${c?'Ders planını düzenle':'Ders planı oluştur'}</h2></div><form class="card" onsubmit="saveClass(event)"><div class="formgrid two"><div class="field"><label>Ders adı *</label><input id="ctitle" class="input" required value="${esc(d.title)}" placeholder="60 dk Yin Yoga"></div><div class="field"><label>Yoga türü</label><select id="ctype"><option value="Yin Yoga" ${(!d.type||d.type==='Yin Yoga')?'selected':''}>Yin Yoga</option><option value="Hatha Yoga" ${d.type==='Hatha Yoga'?'selected':''}>Hatha Yoga</option></select></div><div class="field"><label>Toplam hedef süre (dk)</label><input id="cduration" class="input" type="number" min="1" max="300" value="${d.duration||60}"></div><div class="field"><label>Tema</label><input id="ctheme" class="input" value="${esc(d.theme)}" placeholder="Yavaşlamak ve alan açmak"></div><div class="field"><label>Niyet</label><input id="cintention" class="input" value="${esc(d.intention)}" placeholder="Derse nasıl bir hisle başlıyoruz?"></div></div><div class="section-head"><h2>Pozlar ve sıra</h2><button type="button" class="secondary" onclick="addSequence()">+ Poz ekle</button></div><div id="sequence">${seq.map((s,i)=>sequenceRow(s,i)).join('')}</div><div class="split" style="padding:12px 0"><strong>Planlanan süre</strong><strong id="totalmins">${seq.reduce((a,s)=>a+(Number(s.minutes)||0),0)} dk</strong></div><div class="field"><label>Açılış / rehberli metin</label><textarea id="copening" placeholder="Karşılama, nefes, meditasyon...">${esc(d.opening)}</textarea></div><div class="field" style="margin-top:12px"><label>Kapanış ve ek notlar</label><textarea id="cclosing" placeholder="Savasana, kapanış cümleleri, geçişler...">${esc(d.closing)}</textarea></div><div class="formfooter"><button class="primary" type="submit">Ders planını kaydet</button><button class="secondary" type="button" onclick="go('home')">Vazgeç</button>${c?`<button class="danger" type="button" onclick="deleteItem('class','${c.id}')">Sil</button>`:''}</div></form>`}
function sequenceRow(s,i){return `<div class="sequenceitem"><div class="itemmain"><input class="input" style="width:100%" data-seq-name value="${esc(s.name||'')}" placeholder="Poz / bölüm adı"></div><input type="number" min="0" max="120" data-seq-min value="${Number(s.minutes)||0}" aria-label="Dakika"><button type="button" class="arrow" onclick="this.parentElement.remove();updateTotal()">×</button></div>`}
function addSequence(){let d=document.getElementById('sequence');d.insertAdjacentHTML('beforeend',sequenceRow({name:'',minutes:5},d.children.length));d.querySelectorAll('[data-seq-min]').forEach(x=>x.oninput=updateTotal);updateTotal()}
function updateTotal(){let n=[...document.querySelectorAll('[data-seq-min]')].reduce((a,x)=>a+(Number(x.value)||0),0);let el=document.getElementById('totalmins');if(el)el.textContent=n+' dk'}
function saveClass(e){e.preventDefault();let old=editing?data.classes.find(x=>x.id===editing):null;let sequence=[...document.querySelectorAll('.sequenceitem')].map(r=>({name:r.querySelector('[data-seq-name]').value,minutes:Number(r.querySelector('[data-seq-min]').value)||0})).filter(s=>s.name.trim());let obj={id:old?.id||uid(),title:document.getElementById('ctitle').value.trim(),type:document.getElementById('ctype').value,duration:Number(document.getElementById('cduration').value)||60,theme:document.getElementById('ctheme').value,intention:document.getElementById('cintention').value,sequence,opening:document.getElementById('copening').value,closing:document.getElementById('cclosing').value,created:old?.created||new Date().toISOString(),updated:new Date().toISOString()};if(old)data.classes=data.classes.map(x=>x.id===old.id?obj:x);else data.classes.unshift(obj);save();page='home';editing=null;render()}
function openItem(kind,id){detail={kind,id};page='detail';render()}
function detailPage(){let k=detail?.kind,id=detail?.id,x=k==='note'?data.notes.find(a=>a.id===id):k==='pose'?data.poses.find(a=>a.id===id):data.classes.find(a=>a.id===id);if(!x)return `<button class="back" onclick="go('home')">← Geri</button><p>İçerik bulunamadı.</p>`;let catname=k==='note'?cat(x.category).name:k==='pose'?'Poz Kütüphanesi':'Ders Planı';let body='';if(k==='note')body=`<div class="detailtext">${esc(x.content||'Henüz içerik eklenmemiş.')}</div>`;if(k==='pose')body=`${x.sanskrit?`<p class="muted">${esc(x.sanskrit)} · ${esc(x.type)}</p>`:''}${fieldBlock('Hedeflenen bölgeler',x.areas)}${fieldBlock('Uygulama ve süre',x.content)}${fieldBlock('Varyasyonlar ve ekipman',x.variations)}${fieldBlock('Dikkat edilmesi gerekenler',x.cautions)}${fieldBlock('Kendi notlarım',x.personal)}`;if(k==='class')body=`<div class="taglist"><span class="tag">${esc(x.type||'Yin Yoga')}</span><span class="tag">${x.duration} dk hedef süre</span>${x.theme?`<span class="tag">${esc(x.theme)}</span>`:''}</div>${fieldBlock('Niyet',x.intention)}<h3>Pozlar ve sıra · ${x.sequence.reduce((a,s)=>a+(Number(s.minutes)||0),0)} dk</h3>${x.sequence.map((s,i)=>`<div class="sequenceitem"><div class="itemmain"><strong>${i+1}. ${esc(s.name)}</strong></div><span class="muted">${s.minutes} dk</span></div>`).join('')||'<p class="muted">Henüz poz eklenmemiş.</p>'}${fieldBlock('Açılış / rehberli metin',x.opening)}${fieldBlock('Kapanış ve ek notlar',x.closing)}`;return `<button class="back" onclick="go('${k==='pose'?'library':k==='note'?'notes':'home'}')">← Geri</button><div class="card"><div class="eyebrow">${esc(catname)}</div><h2 class="detailtitle">${esc(x.title)}</h2><p class="muted">Son düzenleme: ${fmt(x.updated||x.created)}</p>${body}<div class="actions"><button class="primary" onclick="editItem('${k}','${x.id}')">Düzenle</button><button class="secondary" onclick="exportOne('${k}','${x.id}')">Bu içeriği dışa aktar</button></div></div>`}
function fieldBlock(label,v){return v?`<div style="margin-top:18px"><h3 style="font-size:14px;margin-bottom:6px">${label}</h3><div class="detailtext">${esc(v)}</div></div>`:''}
function editItem(k,id){if(k==='note')newNote(null,id);else if(k==='pose')newPose(id);else newClass(id)}
function deleteItem(k,id){if(!confirm('Bu içeriği silmek istediğine emin misin?'))return;let key=k==='note'?'notes':k==='pose'?'poses':'classes';data[key]=data[key].filter(x=>x.id!==id);save();page=k==='pose'?'library':k==='note'?'notes':'home';editing=null;detail=null;render()}
function exportData(){const blob=new Blob([JSON.stringify({app:'Yoga Stüdyom',version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'});downloadBlob(blob,'yoga-studyom-yedek-'+new Date().toISOString().slice(0,10)+'.json')}
function exportOne(k,id){let key=k==='note'?'notes':k==='pose'?'poses':'classes';let obj=data[key].find(x=>x.id===id);if(!obj)return;downloadBlob(new Blob([JSON.stringify({kind:k,item:obj},null,2)],{type:'application/json'}),'yoga-studyom-'+k+'-'+(obj.title||'icerik').replace(/[^a-z0-9ğüşıöç-]/gi,'-')+'.json')}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.notes)||!Array.isArray(x.poses)||!Array.isArray(x.classes))throw Error('format');if(!confirm('Yedek yüklensin mi? Mevcut içeriklerin yerine geçecek. Önce mevcut verilerini yedekle.'))return;data={notes:x.notes,poses:x.poses,classes:x.classes};save();go('home');alert('Yedek başarıyla yüklendi.')}catch(err){alert('Bu dosya geçerli bir Yoga Studio yedeği değil.')}};r.readAsText(f);e.target.value=''}
function clearAll(){if(!confirm('Tüm notlar, pozlar ve ders planları kalıcı olarak silinsin mi?'))return;if(!confirm('Son kez soruyoruz: önce yedek almadıysan içeriklerini kaybedebilirsin. Devam edilsin mi?'))return;data={notes:[],poses:[],classes:[]};save();go('home')}
load();render();
</script>
</body>
</html>
